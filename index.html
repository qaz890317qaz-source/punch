<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>員工 GPS 打卡系統</title>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 90vh; margin: 0; background: #f4f6f8; padding: 20px; box-sizing: border-box; }
    .card { background: white; padding: 28px 24px; border-radius: 16px; box-shadow: 0 4px 16px rgba(0,0,0,0.08); width: 100%; max-width: 340px; text-align: center; box-sizing: border-box; }
    h2 { margin-top: 0; color: #333; font-size: 20px; }
    .btn { width: 100%; padding: 14px; margin: 8px 0; font-size: 17px; border: none; border-radius: 10px; cursor: pointer; color: white; font-weight: bold; }
    .btn:active { opacity: 0.8; }
    .btn-in { background-color: #06C755; }
    .btn-out { background-color: #007aff; }
    .input-box { width: 100%; padding: 12px; margin-bottom: 16px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; box-sizing: border-box; }
    #msg { margin-top: 16px; font-size: 14px; line-height: 1.5; font-weight: 500; min-height: 24px; }
    .geo-info { margin-top: 10px; font-size: 12px; color: #666; }
  </style>
</head>
<body>
  <div class="card">
    <h2 id="welcome">載入中...</h2>
    <input type="text" id="empName" class="input-box" placeholder="請輸入姓名或工號">
    <button class="btn btn-in" onclick="punch('上班')">上班打卡</button>
    <button class="btn btn-out" onclick="punch('下班')">下班打卡</button>
    <div id="msg"></div>
    <div id="gpsText" class="geo-info">定位準備中...</div>
  </div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbxy8neRigW5k4FAy_UQpCKzzzqqv6Uu04ocPLW3qOy9tVzQ3EPIAXmDAvyq8IytWndt/exec";
    const LIFF_ID = "2012021341-xEKCNCCh";
    let lineProfile = null;
    let currentCoords = null;

    function getLocation() {
      return new Promise((resolve, reject) => {
        if (!navigator.geolocation) {
          reject("裝置不支援 GPS 定位");
          return;
        }
        navigator.geolocation.getCurrentPosition(
          (pos) => resolve(pos.coords),
          (err) => reject("請允許手機存取位置資訊"),
          { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
        );
      });
    }

    async function init() {
      try {
        await liff.init({ liffId: LIFF_ID });
        if (liff.isLoggedIn()) {
          lineProfile = await liff.getProfile();
          document.getElementById("welcome").innerText = `你好，${lineProfile.displayName}`;
          const saved = localStorage.getItem("emp_name");
          document.getElementById("empName").value = saved || lineProfile.displayName;
        }
      } catch(e) {
        document.getElementById("welcome").innerText = "打卡系統";
      }

      try {
        currentCoords = await getLocation();
        document.getElementById("gpsText").innerText = `GPS 定位成功 (${currentCoords.latitude.toFixed(4)}, ${currentCoords.longitude.toFixed(4)})`;
      } catch (err) {
        document.getElementById("gpsText").innerText = "點擊打卡時將獲取定位";
      }
    }

    async function punch(type) {
      const name = document.getElementById("empName").value.trim();
      const msg = document.getElementById("msg");
      if (!name) {
        alert("請輸入姓名或工號");
        return;
      }
      localStorage.setItem("emp_name", name);
      msg.style.color = "#555";
      msg.innerText = "取得定位並記錄中...";

      try {
        currentCoords = await getLocation();
      } catch (err) {
        msg.style.color = "red";
        msg.innerText = err;
        return;
      }

      // 改用 Image Beacon 方式發送，完全無視任何跨域阻擋與轉址問題
      const targetUrl = GAS_URL + 
        "?lat=" + encodeURIComponent(currentCoords.latitude) +
        "&lng=" + encodeURIComponent(currentCoords.longitude) +
        "&userName=" + encodeURIComponent(lineProfile ? lineProfile.displayName : "未知") +
        "&employeeId=" + encodeURIComponent(name) +
        "&punchType=" + encodeURIComponent(type) +
        "&_t=" + new Date().getTime();

      const img = new Image();
      img.src = targetUrl;

      msg.style.color = "green";
      msg.innerText = `${type}打卡成功！已寫入紀錄。`;
    }

    init();
  </script>
</body>
</html>
